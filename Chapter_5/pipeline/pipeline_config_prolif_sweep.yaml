## =============================================================================
## Pipeline configuration — 2-scenario phenotype comparison
## =============================================================================
## This file is intended to live in the SAME FOLDER as pipeline.py.
## Paths below are therefore written relative to that folder.

results_root: "pipeline_results"

## =============================================================================
## ABM core settings
## =============================================================================

abm:
  # How many stochastic ABM replicates to run per scenario (forward simulations)
  # n_runs: 1000
  n_runs: 100
  n_workers: 8
  seed: 42

  # Defaults / assets (relative to pipeline.py folder)
  defaults_yaml: "scripts_defaults.yaml"
  background_dir: "background"

## =============================================================================
## ABM sweep: ONLY singletons_phase2_fit_all, run twice (one per phenotype)
## =============================================================================
## Each entry below is a separate scenario.
## The pipeline will run ABM → fit ALL ODE models listed under `models` →
## write outputs under a timestamped run folder.



abm_sweep:
  - mode: singletons_phase2_fit_all
    abm_params:
      # Start from singletons
      initial_singleton_count: 800

      overrides:
        # Single-phenotype run
        init.phenotype: proliferative

        # You can fix parameters here if you want
        # merge.p_merge: 0.6
        # phenotypes.proliferative.fragment_rate: 0.0008

## =============================================================================
## ABM PARAMETER SWEEP
## =============================================================================
## This expands the single scenario above into MULTIPLE scenarios
## =============================================================================

abm_param_sweep:
  - apply_to_modes: ["singletons_phase2_fit_all"]
    overrides:
      # Sweep proliferation rate
      phenotypes.proliferative.prolif_rate:
        - 0.004
        - 0.006
        - 0.008
        - 0.010
        - 0.012


  # # ----------------------------
  # # Scenario 2: Invasive
  # # ----------------------------
  # - mode: singletons_phase2_fit_all
  #   abm_params:
  #     initial_singleton_count: 800
  #     overrides:
  #       init.phenotype: invasive

  #       # -------------------------
  #       # EXAMPLES (commented out)
  #       # -------------------------
  #       # (A) Initial number of clusters
  #       # init.n_clusters: 800
  #       # init.size: 1

  #       # (B) Merge probability
  #       # merge.p_merge: 0.6

  #       # (C) Proliferation rate
  #       # phenotypes.invasive.prolif_rate: 0.011

  #       # (D) Fragmentation rate
  #       # phenotypes.invasive.fragment_rate: 0.0008

  #       # (E) Speed distribution parameters
  #       # If movement_v2 is GLOBAL:
  #       # movement_v2.phase2.speed_dist.params.a: 1.2
  #       # movement_v2.phase2.speed_dist.params.scale: 2.5
  #       # movement_v2.phase2.turning.kappa: 0.2
  #       #
  #       # If movement_v2 is PER-PHENOTYPE:
  #       # movement_v2.invasive.phase2.speed_dist.params.a: 1.2
  #       # movement_v2.invasive.phase2.speed_dist.params.scale: 2.5
  #       # movement_v2.invasive.phase2.turning.kappa: 0.2

## =============================================================================
## Optional ABM parameter sweep system (DISABLED)
## =============================================================================
## The pipeline CAN expand scenarios via `abm_param_sweep`, but you asked for
## exactly two ABM runs (proliferative vs invasive) with no extra sweep.
##
## abm_param_sweep:
##   - apply_to_modes: ["singletons_phase2_fit_all"]
##     overrides:
##       merge.p_merge: [0.4, 0.6, 0.8]
##       phenotypes.proliferative.prolif_rate: [0.005, 0.01]

## =============================================================================
## MCMC settings (diagnostics & PPC; AIC comes from MLE stage)
## =============================================================================

mcmc:
  chunk: 10000
  print_every: 2000
  rhat_threshold: 1.05
  # max_total_iters: 200000
  max_total_iters: 80000
  burn_in_fraction: 0.5
  nsamples_ppc: 300
  random_seed: 123

## =============================================================================
## ODE model list
## =============================================================================

models:
  # - no_prolif_no_shed
  ## - no_prolif_cst_shed
  ## - no_prolif_SA_shed
  ## - no_prolif_Cell_num_shed
  ## - cst_prolif_no_shed
  ## - cst_prolif_cst_shed
  ## - cst_prolif_SA_shed
  ## - cst_prolif_Cell_num_shed
  ## - SA_prolif_no_shed
  ## - SA_prolif_cst_shed
  ## - SA_prolif_SA_shed
  ## - SA_prolif_Cell_num_shed
  - Cell_num_prolif_no_shed
  - Cell_num_prolif_cst_shed
  ## - Cell_num_prolif_SA_shed
  ## - Cell_num_prolif_Cell_num_shed

## =============================================================================
